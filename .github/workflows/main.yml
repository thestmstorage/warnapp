name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Wrapper, Config & Instant Registration
        run: |
          for f in *.zip; do [ -e "$f" ] && unzip -q -o "$f"; done
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
          cd "$PROJECT_DIR"

          # 1. Fehlendes gradlew herunterladen
          if [ ! -f "gradlew" ]; then
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew" -o gradlew
            chmod +x gradlew
            mkdir -p gradle/wrapper
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

          # 2. google-services.json erstellen
          mkdir -p app
          echo '{"project_info":{"project_number":"935189919193","project_id":"genz-kommt","storage_bucket":"genz-kommt.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:935189919193:android:de_warnapp_client","android_client_info":{"package_name":"de.warnapp.client"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyCYlAFUiOJnBQwYEvDdY15u8kF0TigJXac"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json

          # 3. Sofort-Registrierung patchen (Direktes FCM Topic Abo in 0,5s mit Live UI-Update)
          find . -name "MainActivity.kt" -exec sed -i 's/Backend.enqueueRegistration(this)/com.google.firebase.messaging.FirebaseMessaging.getInstance().subscribeToTopic("warnapp_prod").addOnCompleteListener { task -> Prefs.setRegStatus(this, if (task.isSuccessful) "Registriert (warnapp_prod)" else "Fehler"); refreshStatus() }/g' {} +

      - name: Build APK with Gradle
        run: |
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarnApp-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-generate Gradle Wrapper & google-services.json
        run: |
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1))
          echo "Projekt-Verzeichnis: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 1. Wrapper generieren falls fehlend
          if [ ! -f "gradlew" ]; then
            echo "Generiere gradlew..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

          # 2. google-services.json automatisch erstellen
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo "Erstelle app/google-services.json für genz-kommt..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "935189919193",
    "project_id": "genz-kommt",
    "storage_bucket": "genz-kommt.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:935189919193:android:de_warnapp_client",
        "android_client_info": {
          "package_name": "de.warnapp.client"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyCYlAFUiOJnBQwYEvDdY15u8kF0TigJXac"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      - name: Build APK with Gradle
        run: |
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1))
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarnApp-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
